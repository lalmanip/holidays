# Holidays REST API — external Spring config (mounted at /config/holidays-api.yaml).
# Apply once on the cluster; CI/CD only updates the Deployment image tag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: holidays-api-config
  labels:
    app: vivance-holidays-api
data:
  holidays-api.yaml: |
    server:
      port: 8095

    spring:
      application:
        name: vivance-holidays-api
      profiles:
        active: dev
      datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:mysql://77.37.45.41:3306/vivance_java?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
        username: ${SPRING_DATASOURCE_USERNAME:root}
        password: ${SPRING_DATASOURCE_PASSWORD:}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 10
          minimum-idle: 2
          connection-timeout: 30000
      jpa:
        hibernate:
          ddl-auto: none
        open-in-view: false
        show-sql: false
        properties:
          hibernate:
            jdbc:
              time_zone: UTC

    vivance:
      holidays:
        cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://vivance.com,http://localhost:3000}
        international-listing-prefix: /international-tour-packages/

    springdoc:
      api-docs:
        path: /api-docs
      swagger-ui:
        path: /swagger-ui.html

    logging:
      level:
        root: INFO
        com.vivance.holidays: INFO
        org.hibernate.SQL: WARN
