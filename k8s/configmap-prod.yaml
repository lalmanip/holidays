# Holidays REST API — LIVE production config (mounted at /config/holidays-api.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: holidays-api-config
  labels:
    app: vivance-holidays-api
    env: prod
data:
  holidays-api.yaml: |
    server:
      port: 8095

    spring:
      application:
        name: vivance-holidays-api
      profiles:
        active: prod
      datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
      jpa:
        hibernate:
          ddl-auto: none
        open-in-view: false
        show-sql: false

    vivance:
      holidays:
        cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
        international-listing-prefix: /international-tour-packages/

    springdoc:
      api-docs:
        path: /api-docs
      swagger-ui:
        path: /swagger-ui.html

    logging:
      level:
        root: WARN
        com.vivance.holidays: INFO
        org.hibernate.SQL: WARN
