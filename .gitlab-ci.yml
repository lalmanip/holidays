stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: vivance/holidays-api
  K8S_DEPLOYMENT: vivance-holidays-api
  K8S_CONTAINER: vivance-holidays-api

.build_template:
  stage: build
  image: docker:26
  services:
    - name: docker:26-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - apk add --no-cache git
  script:
    - VERSION=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -1 | tr -d '[:space:]' | sed 's/-SNAPSHOT//')
    - IMAGE_TAG="${VERSION}-${CI_COMMIT_SHORT_SHA}"
    - FULL_IMAGE="${DOCKER_IMAGE}:${IMAGE_TAG}"
    - echo "Building ${FULL_IMAGE} for linux/amd64"
    - docker context create vivance-ctx
    - docker buildx create --use --name vivance-builder --driver docker-container --driver-opt network=host vivance-ctx
    - docker buildx build --platform linux/amd64 -t "$FULL_IMAGE" --push .
    - |
      if [ "$CI_COMMIT_BRANCH" != "main" ]; then
        docker buildx build --platform linux/amd64 -t "${DOCKER_IMAGE}:dev-latest" --push .
      fi
    - echo "IMAGE_TAG=${IMAGE_TAG}" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

.deploy_template:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts || true
  script:
    - echo "Deploying ${DOCKER_IMAGE}:${IMAGE_TAG} to ${DEPLOY_ENV}"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        kubectl -n vivancetravels set env deployment/${K8S_DEPLOYMENT} SPRING_PROFILES_ACTIVE=${SPRING_PROFILE} && \
        kubectl -n vivancetravels set image deployment/${K8S_DEPLOYMENT} ${K8S_CONTAINER}=${DOCKER_IMAGE}:${IMAGE_TAG} && \
        kubectl -n vivancetravels annotate deployment/${K8S_DEPLOYMENT} \
          kubernetes.io/change-cause='Deploy ${DOCKER_IMAGE}:${IMAGE_TAG} to ${DEPLOY_ENV}' \
          --overwrite && \
        kubectl -n vivancetravels rollout status deployment/${K8S_DEPLOYMENT} --timeout=180s && \
        kubectl -n vivancetravels get pods -l app=vivance-holidays-api -o wide
      "

build-and-push:
  extends: .build_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

deploy:
  extends: .deploy_template
  needs:
    - job: build-and-push
      artifacts: true
  variables:
    DEPLOY_ENV: DEV
    DEPLOY_HOST: "$VPS_HOST"
    DEPLOY_USER: "$VPS_USER"
    SSH_KEY: "$VPS_SSH_KEY"
    SPRING_PROFILE: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

build-and-push-prod:
  extends: .build_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-prod:
  extends: .deploy_template
  needs:
    - job: build-and-push-prod
      artifacts: true
  variables:
    DEPLOY_ENV: LIVE
    DEPLOY_HOST: "$PROD_VPS_HOST"
    DEPLOY_USER: "$PROD_VPS_USER"
    SSH_KEY: "$PROD_VPS_SSH_KEY"
    SPRING_PROFILE: prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
