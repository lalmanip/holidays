spring:
  application:
    name: vivance-holidays-api
  datasource:
    url: jdbc:mysql://localhost:3306/vivance_java?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

server:
  port: ${SERVER_PORT:8095}

vivance:
  holidays:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    international-listing-prefix: /international-tour-packages/

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.vivance.holidays: INFO
    org.hibernate.SQL: WARN
