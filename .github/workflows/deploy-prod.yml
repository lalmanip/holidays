# Build + push holidays-api Docker image on main.
# Deploy manually on prod VPS (or use deploy-prod job if PROD_VPS_* secrets exist).
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Optional deploy: PROD_VPS_HOST, PROD_VPS_USER, PROD_VPS_SSH_KEY

name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: vivance/holidays-api
  K8S_NAMESPACE: vivancetravels
  K8S_DEPLOYMENT_NAME: vivance-holidays-api
  K8S_CONTAINER_NAME: vivance-holidays-api

jobs:
  build-and-push:
    name: Build & Push (Prod)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Resolve image tag
        id: meta
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="${VERSION}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${IMAGE_TAG}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:prod-latest

  deploy-prod:
    name: Deploy to Prod
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to Kubernetes on prod VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            IMAGE="${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
            NS="${{ env.K8S_NAMESPACE }}"
            DEPLOY="${{ env.K8S_DEPLOYMENT_NAME }}"
            CONTAINER="${{ env.K8S_CONTAINER_NAME }}"

            echo "Deploying ${IMAGE} to namespace ${NS}..."
            kubectl -n "${NS}" set env "deployment/${DEPLOY}" SPRING_PROFILES_ACTIVE=prod
            kubectl -n "${NS}" set image "deployment/${DEPLOY}" "${CONTAINER}=${IMAGE}"
            kubectl -n "${NS}" rollout status "deployment/${DEPLOY}" --timeout=180s
            kubectl -n "${NS}" get pods -l app=vivance-holidays-api -o wide
